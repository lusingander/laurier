[package]
name = "laurier"
version = "0.3.0"
edition = "2021"
description = "ratatui helper library"
authors = ["Kyosuke Fujimoto <kyoro.f@gmail.com>"]
documentation = "https://docs.rs/laurier/"
homepage = "https://github.com/lusingander/laurier"
repository = "https://github.com/lusingander/laurier"
readme = "README.md"
license = "MIT"
keywords = []
categories = []
rust-version = "1.86.0"

[dependencies]
console = "0.16.2"
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
ratatui-core = { version = "0.1.0", default-features = false }

[dev-dependencies]
rstest = "0.26.1"
